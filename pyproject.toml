[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "directsaz"
version = "1.1.0"
description = "Directsaz Developer API SDK for Python (Django, FastAPI, Flask, plain)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Directsaz" }]
dependencies = [
  "httpx>=0.27",
]
keywords = ["directsaz", "instagram", "webhook", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Framework :: Django",
  "Framework :: FastAPI",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
django = ["django>=4.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["directsaz*"]
